[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diony-finish"
version = "0.1.0"
description = "Diony AI 720→1080 finish — diony_sr_v1, Rec.709 legalizer, conform"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=1.24",
  "diony-contracts",
]

[project.scripts]
diony-finish = "diony_finish.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
