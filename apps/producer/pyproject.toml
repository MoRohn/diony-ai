[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diony-producer"
version = "0.8.0"
description = "Diony AI Producer — Idea length goal, Dailies, Program stitch, Lock. Live Wan2.2 FARM and diony_sr_v1 1080."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "diony-contracts",
  "diony-wan",
  "diony-finish",
  "httpx>=0.27",
]

[project.scripts]
diony-producer = "diony_producer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diony_producer = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
