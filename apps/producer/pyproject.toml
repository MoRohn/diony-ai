[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diony-producer"
version = "0.9.0"
description = "Diony AI Producer — Idea to Production to Gallery. Live Wan2.2 FARM and diony_sr_v1 1080."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "diony-contracts",
  "diony-wan",
  "diony-finish",
  "httpx>=0.27",
  "boto3>=1.35,<2",
  "cryptography>=43,<48",
  "numpy>=1.24",
]

[project.scripts]
diony-producer = "diony_producer.app:main"
diony-control-worker = "diony_producer.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diony_producer = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
