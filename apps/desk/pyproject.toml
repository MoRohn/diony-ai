[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diony-desk"
version = "0.22.0"
description = "Diony AI first open — the lobby that starts Studio, Director, and Producer and lays the product names"
requires-python = ">=3.11"
authors = [{ name = "Diony AI" }]
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
diony-desk = "diony_desk.boot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diony_desk = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
