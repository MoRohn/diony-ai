[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diony-desk"
version = "0.22.0"
description = "Diony AI first open — install the desk, then Studio and Producer."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.scripts]
diony-desk = "diony_desk.boot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diony_desk = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
