<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diony AI Studio</title>
    <link rel="icon" type="image/png" href="/diony-ai-app-icon.png?v=brand3" />
    <link rel="apple-touch-icon" href="/diony-ai-app-icon.png?v=brand3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,850&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/app.css?v=brand3" />
  </head>
  <body data-product-surface="desk" data-phase="opening">
    <div class="stage-copy" aria-hidden="true">
      <span>Idea in.</span>
      <strong>Show out.</strong>
    </div>
    <header class="mast">
      <p class="brand diony-brand">
        <svg class="diony-mark" viewBox="0 0 480 460" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="dm-bar1" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#FF7A2F" /><stop offset="1" stop-color="#E43B4B" />
            </linearGradient>
            <linearGradient id="dm-bar2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#FF9A35" /><stop offset="1" stop-color="#FF402F" />
            </linearGradient>
            <linearGradient id="dm-bar3" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#FFA23A" /><stop offset=".55" stop-color="#FF7A2F" /><stop offset="1" stop-color="#E43B4B" />
            </linearGradient>
          </defs>
          <rect x="0" y="184" width="26" height="92" rx="13" fill="url(#dm-bar1)" />
          <rect x="54" y="125" width="28" height="210" rx="14" fill="url(#dm-bar2)" />
          <rect x="110" y="30" width="32" height="400" rx="16" fill="url(#dm-bar3)" />
          <rect x="172" y="65" width="50" height="330" rx="9" fill="currentColor" />
          <rect x="248" y="82" width="50" height="296" rx="9" fill="currentColor" />
          <path d="M324 99h24a131 131 0 0 1 0 262h-24z" fill="currentColor" />
        </svg>
        <span class="diony-word">Diony</span>
      </p>
      <p class="site-line">Preparing the local production system</p>
      <nav class="bays" aria-label="Surface">
        <span class="on">Open</span>
      </nav>
    </header>

    <div class="studio">
      <div class="sheet">
        <span class="stack" aria-hidden="true"></span>
        <span class="tooth" aria-hidden="true"></span>
        <img
          class="diony-spirit spirit-desk"
          src="/dionysus-sketch.png?v=desk15"
          width="972"
          height="970"
          alt=""
          aria-hidden="true"
        />

        <p class="meta" id="line-index">Startup</p>
        <h1 id="title">Opening Studio</h1>
        <p id="detail" class="grammar">Getting Studio ready.</p>
        <p id="error" class="err" hidden></p>
        <a id="diagnostics" class="diagnostics hidden" href="/api/diagnostics" download>
          Download diagnostics
        </a>
        <p id="next" class="hint">This page will continue automatically.</p>
        <details id="log-wrap" class="disclose hidden">
          <summary>Details</summary>
          <p id="log" class="snippet"></p>
        </details>

        <a id="pass" class="continue" href="#">
          <span class="advance-nock" aria-hidden="true"></span>
          <span class="clap-slate">Wait</span>
        </a>
      </div>
    </div>
    <script src="/app.js?v=brand3"></script>
  </body>
</html>
