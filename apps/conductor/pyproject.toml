[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diony-conductor"
version = "0.2.0"
description = "Diony AI Conductor stub — DeepSeek tool loop; reads Studio site lock"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "diony-contracts",
  "httpx>=0.27",
]

[project.scripts]
diony-conductor = "diony_conductor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
