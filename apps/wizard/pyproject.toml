[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diony-wizard"
version = "0.20.0"
description = "Diony AI Studio — browser-local cloud camera choice and key readiness"
requires-python = ">=3.11"
authors = [{ name = "Diony AI" }]
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "diony-contracts",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
diony-wizard = "diony_wizard.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diony_wizard = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
