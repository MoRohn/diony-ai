[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diony-wizard"
version = "0.16.0"
description = "Diony AI crate-to-system Wizard — live Dual-Spark pack apply, then Producer."
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "diony-contracts",
]

[project.scripts]
diony-wizard = "diony_wizard.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diony_wizard = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
