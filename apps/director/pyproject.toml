[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diony-director"
version = "0.1.0"
description = "Diony Director Agent: cloud generation conductor (Blueprints 25/26)"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "diony-contracts",
    "diony-producer",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
diony-director = "diony_director.app:main"
diony-director-check = "diony_director.live_check:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diony_director = ["static/*", "ratecards/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
