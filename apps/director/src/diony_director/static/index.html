<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diony Director</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,850&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/app.css?v=p67">
</head>
<body>

<svg hidden aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M10.4 3.6a1.7 1.7 0 0 1 3.2 0l.3 1.2a7 7 0 0 1 1.7 1l1.2-.4a1.7 1.7 0 0 1 2 2.4l-.7 1a7 7 0 0 1 0 2l.7 1a1.7 1.7 0 0 1-2 2.4l-1.2-.4a7 7 0 0 1-1.7 1l-.3 1.2a1.7 1.7 0 0 1-3.2 0l-.3-1.2a7 7 0 0 1-1.7-1l-1.2.4a1.7 1.7 0 0 1-2-2.4l.7-1a7 7 0 0 1 0-2l-.7-1a1.7 1.7 0 0 1 2-2.4l1.2.4a7 7 0 0 1 1.7-1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.2 8.6v4.8l4.2-2.4z" fill="currentColor"/><path d="M8 20.5h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="10" r="1.7" fill="currentColor"/><path d="M4.5 17.5l4.5-4 3.5 3 3-2.5 4 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-clapper" viewBox="0 0 24 24"><path d="M3.5 10h17v8a2.5 2.5 0 0 1-2.5 2.5H6A2.5 2.5 0 0 1 3.5 18z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M3.7 9.8 20.2 6l-.8-2.3a1.5 1.5 0 0 0-1.9-1L4.3 6.3a1.5 1.5 0 0 0-1 1.9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m8.2 8.9 2-3.4M12.7 7.8l2-3.4M17.2 6.7l1.6-2.7" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M13.2 2.8 5.5 13.4h5l-1 7.8 8-11.2h-5.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-image-add" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 17.5l4.5-4 3.5 3 3-2.5 4 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M15.5 8h5M18 5.5v5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<header class="mast">
  <div class="brandlock" aria-label="Diony Director">
    <svg class="diony-mark" viewBox="-4 -4 715 666" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="dr-bar1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#EA573C" /><stop offset="1" stop-color="#E74B43" />
        </linearGradient>
        <linearGradient id="dr-bar2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#EF7921" /><stop offset="1" stop-color="#F46F24" />
        </linearGradient>
        <linearGradient id="dr-bar3" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F38216" /><stop offset=".3" stop-color="#E86C22" /><stop offset=".55" stop-color="#BB462E" /><stop offset=".8" stop-color="#ED453F" /><stop offset="1" stop-color="#F14B42" />
        </linearGradient>
      </defs>
      <rect x="0" y="325" width="39" height="166" rx="19.5" fill="url(#dr-bar1)" />
      <rect x="107" y="210" width="39" height="397" rx="19.5" fill="url(#dr-bar2)" />
      <rect x="211" y="0" width="49" height="658" rx="24.5" fill="url(#dr-bar3)" />
      <rect x="329" y="42" width="56" height="571" rx="28" fill="currentColor" />
      <rect x="445" y="83" width="62" height="484" rx="31" fill="currentColor" />
      <path d="M558 138Q558 124 572 124A135 199.5 0 0 1 572 523Q558 523 558 509Z" fill="currentColor" />
    </svg>
    <span class="diony-word">Diony</span>
    <span class="brandsub">DIRECTOR</span>
  </div>
  <nav class="navlinks">
    <a href="http://127.0.0.1:8787" id="studio-link" title="Configuration and engine selection"><svg class="icon"><use href="#i-gear"/></svg><span>Studio</span></a>
    <a href="http://127.0.0.1:8788" id="producer-link" title="Production monitoring and the Gallery"><svg class="icon"><use href="#i-play"/></svg><span>Producer</span></a>
    <button id="reset" type="button" class="resetbtn" title="Clear the room and start a fresh session — the ledger keeps everything"><svg class="icon"><use href="#i-plus"/></svg><span>New session</span></button>
  </nav>
  <div class="meter" id="meter">
    <span class="chip" id="grok-chip">grok —</span>
    <span class="chip" id="flow-chip">flow —</span>
    <span class="chip" id="brain-chip">brain —</span>
    <span class="chip cost spendstack" id="spent-chip" title="Spend across all sessions in the route's currency: USD for Grok Imagine, plan credits for Google Flow; today is today's spend">
      <span class="spendrow"><span class="spendlbl">total</span><span class="spendval" id="spent-total">$0.00</span></span>
      <span class="spendrow"><span class="spendlbl">today</span><span class="spendval" id="spent-today">$0.00</span></span>
    </span>
  </div>
</header>

<div class="workspace">
  <div class="room">
    <main class="stage">
      <ol class="thread" id="thread" aria-live="polite"></ol>
    </main>

    <footer class="composer" id="composer">
      <div id="composer-resizer" class="composer-resizer" role="separator" aria-label="Resize Director controls" aria-orientation="horizontal" aria-controls="composer-panel" aria-valuemin="20" aria-valuemax="85" aria-valuenow="78" tabindex="0" title="Drag to resize the panes · double-click to reset">
        <span class="composer-resizer-grip" aria-hidden="true"></span>
      </div>
      <div class="composer-divider">
        <button id="composer-toggle" class="composer-toggle" type="button" aria-expanded="true" aria-controls="composer-panel" title="Collapse the Director controls">
          <span class="composer-toggle-copy">
            <span class="composer-toggle-context">Director controls</span>
            <span class="composer-toggle-detail">Cast, prompt, camera &amp; delivery</span>
          </span>
          <span class="composer-toggle-action">
            <span id="composer-toggle-label">Collapse</span>
            <svg class="icon" aria-hidden="true"><use href="#i-chev"/></svg>
          </span>
        </button>
      </div>
      <div class="console" id="composer-panel">
        <div class="castdock" id="castdock" hidden aria-live="polite"></div>
        <div class="runbar" id="runbar" hidden aria-live="polite"></div>
        <div class="entry">
          <textarea id="idea" rows="2" placeholder="Describe the film. One line is enough — the Director writes the script, prices every shot, and locks the cost before anything rolls."></textarea>
          <div class="actions">
            <button id="send" type="button" class="alt"><svg class="icon"><use href="#i-spark"/></svg><span>One shot</span></button>
            <button id="produce" type="button"><svg class="icon"><use href="#i-clapper"/></svg><span>Draft script</span></button>
          </div>
        </div>
        <div class="refbar">
          <button id="add-img" type="button" class="addimg" title="Attach reference stills — they anchor the film's look, characters, and scene; mark one as the opener to open the frame on it"><svg class="icon"><use href="#i-image-add"/></svg><span>Add stills</span></button>
          <input id="img-file" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
          <div class="refchips" id="refchips"></div>
          <span class="refhint" id="refhint">drop or paste stills — they anchor the film's look · click a still's role to make it the opening frame</span>
        </div>
        <div class="controls">
          <label class="pill" title="Which engine rolls the pictures">
            <span class="plabel">Provider</span>
            <select id="provider">
              <option value="grok" selected>Grok Imagine</option>
              <option value="google-flow">Google Flow</option>
            </select>
          </label>
          <div class="durwrap pill" title="Any length — a long one-shot chains into sequential clips">
            <span class="plabel durlabel">Duration</span>
            <span class="durbox" id="durbox">
              <input id="dur-min" type="number" min="0" max="180" step="1" value="0" inputmode="numeric" aria-label="minutes">
              <span class="unit">m</span>
              <span class="sep">:</span>
              <input id="dur-sec" type="number" min="0" max="59" step="1" value="0" inputmode="numeric" aria-label="seconds">
              <span class="unit">s</span>
            </span>
          </div>
          <label class="pill" title="Render resolution">
            <span class="plabel">Res</span>
            <select id="resolution">
              <option value="720p" selected>720p</option>
              <option value="480p">480p</option>
            </select>
          </label>
          <label class="pill" title="Program shape for the whole production — every shot, plate, and the final cut hold this aspect">
            <span class="plabel">Aspect</span>
            <select id="aspect">
              <option value="16:9" selected>16:9</option>
              <option value="9:16">9:16</option>
            </select>
          </label>
          <label class="pill grokpill" title="Grok camera move for one-shot drafts — scripted shots keep their authored camera. Grok route only; Flow never sees it. Type /pushin, /locked… inline for per-shot control.">
            <span class="plabel">Grok cam</span>
            <select id="grok-camera">
              <option value="" selected>Authored</option>
            </select>
          </label>
          <label class="pill grokpill" title="Grok atmosphere — an environmental signature riding every Grok picture (dust, rain, fog…). Grok route only. Type /dust, /wind… inline per shot.">
            <span class="plabel">Grok atmo</span>
            <select id="grok-atmosphere">
              <option value="" selected>None</option>
            </select>
          </label>
          <label class="pill flowpill" title="Google Flow visual world — the style clause every Veo shot carries. Google route only; Grok never sees it. Type /filmic, /cyberpunk… inline for per-shot control.">
            <span class="plabel">Flow style</span>
            <select id="flow-world">
              <option value="baseline" selected>Baseline</option>
            </select>
          </label>
          <label class="pill flowpill" title="Google Flow camera behavior for one-shot drafts — scripted shots keep their authored camera. Type /orbit, /dollyin… inline for per-shot control.">
            <span class="plabel">Flow cam</span>
            <select id="flow-camera">
              <option value="" selected>Authored</option>
            </select>
          </label>
          <label class="pill" title="Production style — how the film's spoken words reach the master (Blueprint 31). Narrated: one narrator records every line in post against the cut; location tracks stay speechless. Dialogue: the script lines ride each clip's prompt and the characters voice them in the clip. Mix: characters speak on camera in the clip, voice-over is narrated in post, and the cut balances, rescues, and mutes per the script. Fixed once the script locks.">
            <span class="plabel">Style</span>
            <select id="style">
              <option value="narrated" selected>Narrated</option>
              <option value="dialogue">Dialogue</option>
              <option value="mix">Mix</option>
            </select>
          </label>
          <label class="pill" title="Cast lock — how character identity holds across the film (Blueprint 32). Standard: character prose on each prompt and a five-angle sheet. Locked: an identity card rides every prompt verbatim, the sheet is an anchor portrait plus a turnaround board measured against it, every clip with people opens from a keyframe composed off the sheet, references are tagged for the provider, and Flow characters register themselves. Fixed once the script locks.">
            <span class="plabel">Cast</span>
            <select id="cast">
              <option value="standard" selected>Standard</option>
              <option value="locked">Locked</option>
            </select>
          </label>
          <label class="pill" title="Narrator voice for the whole film — recorded in post, one voice per film (Blueprint 28). Auto lets the Director cast from the film's tone and speaker; a name pins one Grok voice. Changeable any time before the cut. Under the Dialogue style the narrator only speaks a line the clip left unvoiced.">
            <span class="plabel">Voice</span>
            <select id="voice">
              <option value="" selected>Auto</option>
            </select>
          </label>
          <label class="pill" id="brain-pill" title="Which model writes the script, derives the master prompt, and audits likeness. Auto follows the camera — Gemini on Google Flow, Grok on Grok Imagine — and borrows the other house when the camera's own key is missing. A named brain needs its key.">
            <span class="plabel">Brain</span>
            <select id="brain">
              <option value="auto" selected>Auto</option>
            </select>
          </label>
          <span class="durhint" id="durhint">set a length — seconds for one shot, minutes for a scripted piece</span>
          <span class="lexchip" id="lexchip" hidden title="The session's active look — it rides every prompt it can legally reach"></span>
          <span class="lexhint" id="lexhint" hidden></span>
        </div>
        <div class="pairrow flowpill" id="pairrow" hidden></div>
      </div>
    </footer>
  </div>
</div>
<script src="/static/app.js?v=p67"></script>
</body>
</html>
