name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg (assembly, narration and review tests skip without it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install the workspace
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/contracts -e apps/wizard -e apps/producer -e apps/director -e apps/desk
          pip install pytest
      - name: Offline test suite
        # The root conftest blocks every non-loopback socket; nothing here reaches a provider.
        run: pytest -q
