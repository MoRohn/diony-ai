[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diony-contracts"
version = "0.2.0"
description = "Diony AI machine API: Director ops and cost estimates, production packages (Script, ClipUnit, ClipReview), the launch control plane, and the legacy Project/Shot/Take contracts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Diony AI" }]
dependencies = [
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
diony-export-schemas = "diony_contracts.export_schema:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diony_contracts = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
