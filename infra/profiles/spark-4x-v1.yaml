# Diony AI cluster profile — spark-4x-v1
# Infrastructure as a Product. Studio and Conductor share this desired state.
# Live mutation is Week 2+. Day 1: source of truth for shells and health stubs.

apiVersion: diony.ai/v1
kind: ClusterProfile
metadata:
  name: spark-4x-v1
  sku: "Diony AI Cluster spark-4x-v1"
  version: "1.0.0"

spec:
  nodes:
    - hostname: spark-01
      role: primary
      tp_rank_brain: 0
      split: brain
    - hostname: spark-02
      role: peer
      tp_rank_brain: 1
      split: brain
    - hostname: spark-03
      role: peer
      tp_rank_brain: 2
      split: wan_a
    - hostname: spark-04
      role: peer
      tp_rank_brain: 3
      split: wan_b

  networks:
    fabric:
      nic: connectx7
      spark_port: 2
      mtu: 9000
      speed_gbps: 200
      roce: v2
      ip_plan_example:
        cidr: 192.168.200.0/24
        spark-01: 192.168.200.11
        spark-02: 192.168.200.12
        spark-03: 192.168.200.13
        spark-04: 192.168.200.14
      notes: "Studio records Sync's real IP plan. Dual-half addressing may add a second /24."
    management:
      nic: rj45_10gbe
      mtu: 1500
      purpose: ["wizard", "producer", "sync_enrollment", "vault_nfs"]

  switch:
    allowed_skus:
      - MikroTik CRS804-4DDQ-HRM
      - MikroTik CRS812-8DS-2DQ-2DDQ
    autoneg: false
    force_speed: 200G
    fec: rs-fec
    snippets:
      - infra/switch/crs804-200g.rsc
      - infra/switch/crs812-200g.rsc

  storage:
    models: /models
    scratch: /scratch
    vault: /diony/vault
    vault_fstab: infra/storage/vault.fstab.example
    vault_min_free_percent: 15
    scratch_max_used_percent: 70

  models:
    manifest: infra/models/manifest.yaml

  fleet:
    default_mode: SPLIT
    modes:
      BRAIN:
        compose: infra/compose/brain.yml
        parallel: tp4
        services: [brain]
      SPLIT:
        compose: infra/compose/split.yml
        services: [brain, wan]
      FARM:
        compose: infra/compose/wan.yml
        services: [wan]
      FINISH:
        compose: infra/compose/finish.yml
        services: [finish]
    transition: [drain, unload, load, healthgate]

  health:
    script: infra/health/check_cluster.py
    brain_path: /v1/models
    wan_path: /health
    finish_path: /health

  software:
    wizard_bind: "0.0.0.0:8787"
    producer_bind: "0.0.0.0:8788"
    conductor_bind: "127.0.0.1:8789"
    dry_run_default: true

status:
  # Written by healthgate on the cluster; example only in git
  mode: SPLIT
  dry_run: true
  updated_at: null
