# Diony AI cluster profile — b300-v1
# One leased NVIDIA Blackwell B300. Same product: DeepSeek, Wan 720 negative, Diony 1080, /diony/vault, Producer.
# Not the desk crate. Not a 4-node lease (4×B300). Wizard Site requires a named human.
# Spark TP=2/TP=4 flags are not this recipe. 4×GB300 data-parallel is not this recipe.

apiVersion: diony.ai/v1
kind: ClusterProfile
metadata:
  name: b300-v1
  sku: "Diony AI Cluster b300-v1"
  version: "1.0.0"

spec:
  nodes:
    - hostname: b300-01
      role: primary
      tp_rank_brain: 0
      split: sequential

  networks:
    fabric:
      nic: on_package
      spark_port: null
      mtu: null
      speed_gbps: null
      roce: null
      allowed: [NVLink, on-package]
      ip_plan_example:
        b300-01: 127.0.0.1
      notes: "One GPU. No four-node RoCE loom. NCCL stays on-package."
    management:
      nic: host_mgmt
      mtu: 1500
      purpose: ["wizard", "producer", "vault"]

  switch:
    allowed_skus:
      - On-package
      - NVLink
    autoneg: false
    force_speed: on-package
    fail_if: ["50G", "four_node_loom", "public_nic_nccl", "spark_tp_flags"]
    snippets:
      - infra/switch/b300-node.md

  storage:
    models: /models
    scratch: /scratch
    vault: /diony/vault
    vault_fstab: infra/storage/vault.fstab.example
    vault_min_free_percent: 15
    scratch_max_used_percent: 70

  models:
    manifest: infra/models/manifest.yaml

  fleet:
    default_mode: SPLIT
    modes:
      BRAIN:
        compose: infra/compose/brain-b300.yml
        parallel: tp1
        services: [brain]
      SPLIT:
        compose: infra/compose/split-b300.yml
        concurrent: false
        services: [brain, wan]
      FARM:
        compose: infra/compose/wan.yml
        services: [wan]
      FINISH:
        compose: infra/compose/finish.yml
        services: [finish]
    transition: [drain, unload, load, healthgate]
    notes: "SPLIT is time-share on one GPU. Do not co-resident DeepSeek and Wan A14B until measured."

  health:
    script: infra/health/check_cluster.py
    brain_path: /v1/models
    wan_path: /health
    finish_path: /health

  software:
    wizard_bind: "0.0.0.0:8787"
    producer_bind: "0.0.0.0:8788"
    conductor_bind: "127.0.0.1:8789"
    dry_run_default: true

status:
  mode: SPLIT
  dry_run: true
  updated_at: null
