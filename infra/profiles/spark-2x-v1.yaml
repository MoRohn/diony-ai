# Diony AI cluster profile — spark-2x-v1
# Two leased NVIDIA DGX Spark GB10 (256 GB unified). Same product: DeepSeek, Wan 720
# negative, Diony 1080, /diony/vault, Producer.
# Not the desk crate (spark-4x-v1). Not a four-node lease. Not B300.
# Wizard Site requires a named human. Brain is Spark TP=2. SPLIT is sequential.
# Do not paste TP=4. Do not co-resident DeepSeek and Wan A14B.

apiVersion: diony.ai/v1
kind: ClusterProfile
metadata:
  name: spark-2x-v1
  sku: "Diony AI Cluster spark-2x-v1"
  version: "1.0.0"

spec:
  nodes:
    - hostname: spark-01
      role: primary
      tp_rank_brain: 0
      split: sequential
    - hostname: spark-02
      role: peer
      tp_rank_brain: 1
      split: sequential

  networks:
    fabric:
      nic: connectx7
      spark_port: 2
      mtu: 9000
      speed_gbps: 200
      roce: v2
      allowed: [RoCE]
      ip_plan_example:
        spark-01: 192.168.200.11
        spark-02: 192.168.200.12
      notes: "TP=2 needs RoCE between this pair. Isolated Sparks on a LAN fail the brain."
    management:
      nic: host_mgmt
      mtu: 1500
      purpose: ["wizard", "producer", "vault"]

  switch:
    allowed_skus:
      - CX-7 RoCE
      - RoCE
    autoneg: false
    force_speed: 200G
    fail_if: ["50G", "isolated_nodes", "no_fabric", "four_node_loom", "spark_tp4_flags"]
    snippets:
      - infra/switch/spark-2x-interconnect.md

  storage:
    models: /models
    scratch: /scratch
    vault: /diony/vault
    vault_fstab: infra/storage/vault.fstab.example
    vault_min_free_percent: 15
    scratch_max_used_percent: 70

  models:
    manifest: infra/models/manifest.yaml

  fleet:
    default_mode: SPLIT
    modes:
      BRAIN:
        compose: infra/compose/brain-spark-2x.yml
        parallel: tp2
        services: [brain]
      SPLIT:
        compose: infra/compose/split-spark-2x.yml
        concurrent: false
        services: [brain, wan]
      FARM:
        compose: infra/compose/wan.yml
        services: [wan]
      FINISH:
        compose: infra/compose/finish.yml
        services: [finish]
    transition: [drain, unload, load, healthgate]
    notes: "BRAIN is TP=2 on this pair, not TP=4. SPLIT is time-share. Do not co-resident DeepSeek and Wan A14B. Do not quote spark-4x-v1 2–5 day SLA."

  health:
    script: infra/health/check_cluster.py
    brain_path: /v1/models
    wan_path: /health
    finish_path: /health

  software:
    wizard_bind: "0.0.0.0:8787"
    producer_bind: "0.0.0.0:8788"
    conductor_bind: "127.0.0.1:8789"
    dry_run_default: true

status:
  mode: SPLIT
  dry_run: true
  updated_at: null
