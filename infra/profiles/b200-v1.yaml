# Diony AI cluster profile — b200-v1
# One leased NVIDIA Blackwell B200 (Runpod: 180 GB). Same product: DeepSeek, Wan 720 negative,
# Diony 1080, /diony/vault, Producer. Not the desk crate. Not B300 (288 GB). Not a 4-node lease.
# Studio Site requires a named human. Spark TP=2/TP=4 flags are not this recipe.
# 4×GB300 data-parallel is not this recipe. Weights ~155.4 GiB; pin max_model_len after first load.

apiVersion: diony.ai/v1
kind: ClusterProfile
metadata:
  name: b200-v1
  sku: "Diony AI Cluster b200-v1"
  version: "1.0.0"

spec:
  nodes:
    - hostname: b200-01
      role: primary
      tp_rank_brain: 0
      split: sequential

  networks:
    fabric:
      nic: on_package
      spark_port: null
      mtu: null
      speed_gbps: null
      roce: null
      allowed: [NVLink, on-package]
      ip_plan_example:
        b200-01: 127.0.0.1
      notes: "One GPU, 180 GB class. No four-node RoCE loom. NCCL stays on-package."
    management:
      nic: host_mgmt
      mtu: 1500
      purpose: ["wizard", "producer", "vault"]

  switch:
    allowed_skus:
      - On-package
      - NVLink
    autoneg: false
    force_speed: on-package
    fail_if: ["50G", "four_node_loom", "public_nic_nccl", "spark_tp_flags", "b300_1m_context"]
    snippets:
      - infra/switch/b200-node.md

  storage:
    models: /models
    scratch: /scratch
    vault: /diony/vault
    vault_fstab: infra/storage/vault.fstab.example
    vault_min_free_percent: 15
    scratch_max_used_percent: 70

  models:
    manifest: infra/models/manifest.yaml

  fleet:
    default_mode: SPLIT
    modes:
      BRAIN:
        compose: infra/compose/brain-b200.yml
        parallel: tp1
        services: [brain]
      SPLIT:
        compose: infra/compose/split-b200.yml
        concurrent: false
        services: [brain, wan]
      FARM:
        compose: infra/compose/wan.yml
        services: [wan]
      FINISH:
        compose: infra/compose/finish.yml
        services: [finish]
    transition: [drain, unload, load, healthgate]
    notes: "SPLIT is time-share on one 180 GB GPU. Do not co-resident DeepSeek and Wan A14B until measured."

  health:
    script: infra/health/check_cluster.py
    brain_path: /v1/models
    wan_path: /health
    finish_path: /health

  software:
    wizard_bind: "0.0.0.0:8787"
    producer_bind: "0.0.0.0:8788"
    conductor_bind: "127.0.0.1:8789"
    dry_run_default: true

  performance:
    activation: held_pending_isolated_validation
    five_second_shot_budget:
      end_to_end_seconds_lt: 600
      includes: [voice, wan_720, autoqc, finish_1080]
      cold_and_steady_state_required: true
      proof: durable_stage_and_take_receipts
    wan_resident:
      enabled: false
      candidate: persistent-bf16-resident-v1
      tasks: [t2v-A14B, i2v-A14B, s2v-14B]
      concurrent_clips: 1
      prewarm_before_first_shot: true
      prewarm_counts_toward_cold_budget: true
      precision: bfloat16
      sample_steps: 24
      canary_percent: 10
      validation_receipt: null
      validation_receipt_paths:
        eager: /diony/vault/qualification/wan-resident-validation.json
        regional_compile: /diony/vault/qualification/wan-regional-compile-validation.json
      automatic_fallback: pinned_generate_py
    measured_qc:
      required: false
      measurement_version: diony-temporal-v1
    storage:
      overlay_min_free_gb: 15

status:
  mode: SPLIT
  dry_run: true
  updated_at: null
