# SPLIT mode — brain on spark-01/02 (TP=2), wan on spark-03/04.
# Host placement is a cluster scheduler concern (Week 2+). This file names
# both services so the profile can point at one compose project.

include:
  - path: brain.yml
  - path: wan.yml

# Override brain TP for SPLIT (2 nodes, not 4). Week 2+ scheduler applies
# this on spark-01/02 only.
services:
  brain:
    command:
      - vllm
      - serve
      - /models/deepseek/DeepSeek-V4-Flash-0731
      - --trust-remote-code
      - --kv-cache-dtype
      - nvfp4_ds_mla
      - --block-size
      - "256"
      - --tensor-parallel-size
      - "2"
      - --nnodes
      - "2"
      - --enable-expert-parallel
      - --max-model-len
      - "1048576"
      - --max-num-seqs
      - "6"
      - --gpu-memory-utilization
      - "0.85"
      - --speculative-config
      - '{"method":"dspark","num_speculative_tokens":3,"draft_sample_method":"probabilistic"}'
